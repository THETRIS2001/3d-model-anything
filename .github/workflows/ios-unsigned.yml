# Unsigned iPhone build of the 3D Model Anything capture app, for sideloading.
#
# No Mac needed: GitHub's macOS runner generates the Xcode project with
# XcodeGen and builds a Release .ipa with code signing turned off. Install
# it with Sideloadly (or any re-signing tool), which signs it with your own
# Apple ID on your computer. A free Apple ID signature lasts 7 days.
#
# The bundle id is overridden because com.wesbos.* belongs to another team.
#
# Run from Actions > iOS unsigned > Run workflow, or:
#   gh workflow run ios-unsigned.yml
#   gh run download <id> -n 3d-model-anything-ipa

name: iOS unsigned

on:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: "Bundle identifier"
        required: false
        default: "io.github.thetris2001.housecapture"

concurrency:
  group: ios-unsigned
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: apps/house-capture
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          set -e
          xcodebuild -version
          brew install xcodegen
          xcodegen --version

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Build (Release, unsigned)
        env:
          BUNDLE_ID: ${{ inputs.bundle_id }}
        run: |
          set -o pipefail
          mkdir -p build
          xcodebuild \
            -project HouseCapture.xcodeproj \
            -target HouseCapture \
            -configuration Release \
            -sdk iphoneos \
            SYMROOT="$PWD/build" \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build/xcodebuild.log | grep -E "error:|\*\* BUILD" || true
          if ! grep -q "\*\* BUILD SUCCEEDED \*\*" build/xcodebuild.log; then
            echo "=== build failed ==="
            grep -E "error:" build/xcodebuild.log | sort -u | head -60 || true
            tail -40 build/xcodebuild.log
            exit 1
          fi

      - name: Package the .ipa
        run: |
          set -e
          APP="build/Release-iphoneos/HouseCapture.app"
          test -d "$APP" || { echo "missing $APP"; ls -R build | head -50; exit 1; }
          /usr/libexec/PlistBuddy -c "Print :CFBundleIdentifier" "$APP/Info.plist"
          rm -rf build/ipa && mkdir -p build/ipa/Payload
          cp -R "$APP" build/ipa/Payload/
          (cd build/ipa && zip -qry ../3DModelAnything.ipa Payload)
          ls -la build/3DModelAnything.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: 3d-model-anything-ipa
          path: apps/house-capture/build/3DModelAnything.ipa
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xcodebuild-log
          path: apps/house-capture/build/xcodebuild.log
          retention-days: 7
          if-no-files-found: ignore
