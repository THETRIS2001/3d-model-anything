# Signed App Store build of the capture app, uploaded to TestFlight.
#
# Same steps as the unsigned build, plus App Store signing: the existing
# Apple Distribution certificate goes into a temporary keychain, the App
# Store provisioning profile is installed, and the exported .ipa is
# uploaded with the App Store Connect API key. Nothing identifying the team
# lives in this file: everything comes from repository secrets, which GitHub
# masks in the (public) logs. xcodebuild runs with -quiet and no log is
# uploaded, so the signing identity's name stays out of the logs too.
#
# Secrets: ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8, APPLE_TEAM_ID,
#          APPLE_CERT_P12 (base64), APPLE_CERT_PASSWORD,
#          APPSTORE_PROFILE_B64 (base64 .mobileprovision),
#          IOS_BUNDLE_ID, IOS_PROFILE_NAME
#
# Run from Actions > iOS TestFlight > Run workflow, or:
#   gh workflow run ios-testflight.yml

name: iOS TestFlight

on:
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  testflight:
    runs-on: macos-26
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/house-capture
    env:
      BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
      PROFILE_NAME: ${{ secrets.IOS_PROFILE_NAME }}
      TEAM: ${{ secrets.APPLE_TEAM_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Tools
        run: |
          set -e
          xcodebuild -version
          brew install xcodegen

      - name: Generate the Xcode project and set the build number
        run: |
          set -e
          xcodegen generate
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion ${{ github.run_number }}" HouseCapture/Info.plist
          echo "build ${{ github.run_number }}"

      - name: App Store Connect API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          set -e
          test -n "$ASC_KEY_P8" || { echo "missing secret ASC_KEY_P8"; exit 1; }
          mkdir -p ~/.appstoreconnect/private_keys
          printf '%s' "$ASC_KEY_P8" | tr -d '\r' > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8

      - name: Distribution certificate into a temporary keychain
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          set -e
          test -n "$APPLE_CERT_P12" || { echo "missing secret APPLE_CERT_P12"; exit 1; }
          KC="$RUNNER_TEMP/signing.keychain-db"
          PW=$(openssl rand -hex 16)
          echo "$APPLE_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security create-keychain -p "$PW" "$KC"
          security set-keychain-settings -lut 21600 "$KC"
          security unlock-keychain -p "$PW" "$KC"
          curl -sSf -o "$RUNNER_TEMP/wwdrg3.der" https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import "$RUNNER_TEMP/wwdrg3.der" -k "$KC" -t cert || true
          security import "$RUNNER_TEMP/dist.p12" -P "$APPLE_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KC"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$PW" "$KC" > /dev/null
          security list-keychains -d user -s "$KC" login.keychain-db
          rm -f "$RUNNER_TEMP/dist.p12"
          security find-identity -v -p codesigning "$KC" | grep -q "Apple Distribution" \
            || { echo "no valid 'Apple Distribution' identity"; exit 1; }

      - name: Install the App Store provisioning profile
        env:
          APPSTORE_PROFILE_B64: ${{ secrets.APPSTORE_PROFILE_B64 }}
        run: |
          set -e
          test -n "$APPSTORE_PROFILE_B64" || { echo "missing secret APPSTORE_PROFILE_B64"; exit 1; }
          echo "$APPSTORE_PROFILE_B64" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          UUID=$(security cms -D -i "$RUNNER_TEMP/app.mobileprovision" | plutil -extract UUID raw -)
          for d in "$HOME/Library/MobileDevice/Provisioning Profiles" "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$d"; cp "$RUNNER_TEMP/app.mobileprovision" "$d/$UUID.mobileprovision"
          done
          echo "profile $UUID installed"

      - name: Archive (signed)
        run: |
          set -o pipefail
          mkdir -p build
          if xcodebuild -quiet \
            -project HouseCapture.xcodeproj \
            -scheme HouseCapture \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/HouseCapture.xcarchive \
            PRODUCT_BUNDLE_IDENTIFIER="$BUNDLE_ID" \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME" \
            archive > build/archive.log 2>&1; then
            echo "archive succeeded"
          else
            echo "=== archive failed ==="
            grep -E "error:" build/archive.log | sed -E 's/Apple Distribution: [^"(]*/Apple Distribution: <name> /g' | sort -u | head -60 || true
            exit 1
          fi

      - name: Export the App Store .ipa
        run: |
          set -e
          cat > ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>teamID</key><string>${TEAM}</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>uploadSymbols</key><true/>
            <key>provisioningProfiles</key>
            <dict>
              <key>${BUNDLE_ID}</key><string>${PROFILE_NAME}</string>
            </dict>
          </dict>
          </plist>
          PLIST
          xcodebuild -quiet -exportArchive \
            -archivePath build/HouseCapture.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath build/export
          ls build/export/*.ipa > /dev/null && echo "ipa exported"

      - name: Upload to TestFlight
        env:
          KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ISSUER: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          set -e
          IPA=$(ls build/export/*.ipa | head -1)
          if xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$KEY_ID" --apiIssuer "$ISSUER"; then
            echo "uploaded with altool"
          else
            echo "altool failed: retrying with xcodebuild"
            sed 's#<string>export</string>#<string>upload</string>#' ExportOptions.plist > Upload.plist
            xcodebuild -quiet -exportArchive \
              -archivePath build/HouseCapture.xcarchive \
              -exportOptionsPlist Upload.plist \
              -exportPath build/upload \
              -authenticationKeyPath ~/.appstoreconnect/private_keys/AuthKey_${KEY_ID}.p8 \
              -authenticationKeyID "$KEY_ID" \
              -authenticationKeyIssuerID "$ISSUER"
          fi
          echo "Apple processes the build in a few minutes, then it appears in TestFlight."

      - name: Remove the temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
